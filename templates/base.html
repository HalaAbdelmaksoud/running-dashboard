<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demonstration running dashboards designed around what I look for as a runner. Data and intervals reflect personal experience and reading, not scientific research.">
  <meta name="data-provenance" content="The running data is dummy data generated by Claude from an Excel workbook for demonstration purposes.">
  <meta name="development-process" content="Built using vibe coding based on my directions for each page's content and the charts used to visualize the data.">
  <title>{% block title %}Running dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="viz-root">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Run Log</div>
    <nav class="tabs" aria-label="Dashboards">
      <a href="{{ url_for('weekly') }}" class="tab {% if page == 'weekly' %}active{% endif %}">Weekly</a>
      <a href="{{ url_for('monthly') }}" class="tab {% if page == 'monthly' %}active{% endif %}">Monthly</a>
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">Dummy demonstration data generated by Claude · reloads on every refresh</footer>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="{{ url_for('static', filename='tooltip.js') }}"></script>
</body>
</html>
